services:
  mysql:
    image: mysql:8.4
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=${JDBC_PASSWORD}'
      - 'MYSQL_USER=myuser'
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: 'redis:latest'
    ports:
      - '6379'
volumes:
  mysql-data: